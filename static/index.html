<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>学習リフレクション</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><small>UDEMY LEARNING JOURNAL</small><h1>学びの輪郭を、残す。</h1><p>視聴 → 振り返り → 弱点の見直し。自分のペースで積み重ねる学習ノート。</p></div><nav><a href="/api/export.csv">CSV保存</a><a href="/api/export.json">JSON保存</a></nav></header>
<div id="message" role="status" aria-live="polite"></div>
<main><aside><h2>講座</h2><form id="course-form"><label>講座名<input name="name" required placeholder="例：Python基礎講座" maxlength="300"></label><button>講座を追加</button></form><div id="courses"></div></aside>
<section><div id="overview"></div><div class="card"><h2>単元・レクチャー</h2><form id="lecture-form"><label>単元名<input name="title" required placeholder="例：03 / 関数の引数" maxlength="300"></label><button>単元を追加</button></form><label>表示<select id="filter"><option value="all">すべての単元</option><option value="unwatched">未視聴</option><option value="weak">理解度が低い・不明点あり</option><option value="unreflected">視聴済み・振り返り未記入</option></select></label><div id="lectures"></div></div></section>
<section class="card" id="journal"><h2 id="journal-title">振り返り</h2><p id="selection-hint">単元を選ぶと記録できます。</p><form id="reflection-form"><fieldset disabled id="reflection-fields"><label>記録日時<input type="datetime-local" name="recorded_at" required></label><label>理解したこと<textarea name="understood" rows="3" placeholder="自分の言葉で説明すると？"></textarea></label><label>不明点・次に確かめたいこと<textarea name="unclear" rows="3"></textarea></label><div class="ratings"><label>満足度<select name="satisfaction"><option value="1">1 / 不満</option><option value="2">2 / やや不満</option><option value="3" selected>3 / 普通</option><option value="4">4 / 満足</option><option value="5">5 / とても満足</option></select></label><label>理解度<select name="understanding"><option value="1">1 / ほぼ不明</option><option value="2">2 / 一部理解</option><option value="3" selected>3 / 概要を理解</option><option value="4">4 / 説明できる</option><option value="5">5 / 応用できる</option></select></label></div><label>その満足度にした理由<textarea name="reason" required rows="2"></textarea></label><label>自由記述<textarea name="notes" rows="2"></textarea></label><button>振り返りを保存</button><p class="muted">再記入すると履歴が追加され、理解の変化を追えます。</p></fieldset></form><h3>振り返りの履歴</h3><div id="history"></div></section></main><script src="/app.js"></script></body></html>
